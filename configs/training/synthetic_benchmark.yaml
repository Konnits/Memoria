num_epochs: 30
device: cuda
loss_name: huber
grad_clip_norm: 1.0
log_every_n_steps: 50
early_stopping_patience: 6
early_stopping_min_delta: 0.0001
restore_best_weights: true
use_amp: true
enable_cuda_runtime_optimizations: true
use_torch_compile: false
checkpoint_dir: experiments/synthetic_benchmark
save_best_on: val_rmse
seed: 42
optimizer:
  optimizer_name: adamw
  lr: 0.0003
  weight_decay: 0.003
  scheduler_name: cosine_warmup
  scheduler_T_max: 30
  warmup_epochs: 3